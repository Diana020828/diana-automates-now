<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph template, "Nature distilled" system: cream paper, plum ink,
    terracotta, lavender and sage. scripts/generate-og-image.sh replaces
    @@KICKER@@, @@LINE1@@, @@LINE2@@, @@LINE3@@ and the funnel labels per locale.
  -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F6F1E7"/>
  <circle cx="1080" cy="80" r="220" fill="#E4DCF5" filter="url(#blur)"/>
  <circle cx="80" cy="610" r="200" fill="#DCE9DF" filter="url(#blur)"/>

  <!-- Headline -->
  <circle cx="72" cy="94" r="6" fill="#D2553A"/>
  <text x="90" y="101" font-family="Instrument Sans" font-weight="500" font-size="22" fill="#5C4B5F">@@KICKER@@</text>
  <text x="62" y="222" font-family="Fraunces" font-weight="500" font-size="92" fill="#2A1B2E">@@LINE1@@</text>
  <text x="62" y="318" font-family="Fraunces" font-weight="500" font-size="92" fill="#2A1B2E">@@LINE2@@</text>
  <rect x="60" y="370" width="@@LINE3_WIDTH@@" height="30" fill="#E4DCF5"/>
  <text x="62" y="414" font-family="Fraunces" font-style="italic" font-weight="500" font-size="92" fill="#A63C24">@@LINE3@@</text>
  <text x="64" y="540" font-family="Instrument Sans" font-weight="600" font-size="24" fill="#2A1B2E">portfoliodiana.netlify.app</text>

  <!-- Mini funnel card -->
  <rect x="770" y="150" width="370" height="330" rx="34" fill="#FCF9F3" stroke="#DDD0BA" stroke-width="2"/>
  <line x1="818" y1="210" x2="818" y2="420" stroke="#DDD0BA" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Instrument Sans" font-size="21" fill="#2A1B2E">
    <rect x="788" y="182" width="334" height="60" rx="20" fill="#DCE9DF"/>
    <circle cx="818" cy="212" r="18" fill="#FCF9F3" stroke="#2A1B2E" stroke-width="2"/>
    <text x="850" y="219" font-weight="600">@@STAGE1@@</text>

    <rect x="788" y="250" width="334" height="60" rx="20" fill="#DCE9DF"/>
    <circle cx="818" cy="280" r="18" fill="#FCF9F3" stroke="#2A1B2E" stroke-width="2"/>
    <text x="850" y="287" font-weight="600">@@STAGE2@@</text>

    <rect x="788" y="318" width="334" height="60" rx="20" fill="#E4DCF5"/>
    <circle cx="818" cy="348" r="18" fill="#FCF9F3" stroke="#2A1B2E" stroke-width="2"/>
    <text x="850" y="355" font-weight="600">@@STAGE3@@</text>

    <rect x="788" y="386" width="334" height="60" rx="20" fill="none"/>
    <circle cx="818" cy="416" r="18" fill="#F6F1E7" stroke="#DDD0BA" stroke-width="2"/>
    <text x="850" y="423" font-weight="600" fill="#5C4B5F">@@STAGE4@@</text>
  </g>
  <circle cx="1098" cy="212" r="8" fill="#A63C24"/>
  <circle cx="1098" cy="280" r="8" fill="#A63C24"/>
</svg>
