<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Fondo cálido oscuro (modo oscuro del portafolio) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1611"/>
      <stop offset="1" stop-color="#120d0a"/>
    </linearGradient>
    <!-- Brillo terracota -->
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#cc5c33" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#cc5c33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cc5c33"/>
      <stop offset="1" stop-color="#d99873"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Tag superior tipo monospace -->
  <text x="80" y="150" font-family="DejaVu Sans Mono, monospace" font-size="@@TECH_SIZE@@"
        letter-spacing="@@TECH_SPACING@@" fill="#8db58d" font-weight="bold">@@TECH@@</text>

  <!-- Nombre -->
  <text x="78" y="300" font-family="DejaVu Sans, sans-serif" font-size="110"
        fill="#ece5d8" font-weight="bold">Diana Pinzon</text>

  <!-- Subtítulo / rol -->
  <text x="80" y="372" font-family="DejaVu Sans, sans-serif" font-size="37"
        fill="url(#accent)" font-weight="bold">@@SUBTITLE@@</text>

  <!-- Regla terracota -->
  <rect x="82" y="430" width="220" height="6" rx="3" fill="url(#accent)"/>

  <!-- Stack -->
  <text x="80" y="500" font-family="DejaVu Sans, sans-serif" font-size="30"
        fill="#c9bfae">n8n · Zapier · GoHighLevel · Webflow · React · Astro</text>

  <!-- URL -->
  <text x="80" y="560" font-family="DejaVu Sans Mono, monospace" font-size="26"
        fill="#9c917f">portfoliodiana.netlify.app</text>
</svg>
