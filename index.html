    <!-- Tema aplicado antes del primer pintado. El ThemeProvider lo hace en un
         useEffect, es decir después de pintar: sin esto se ve un parpadeo entre el
         HTML servido y el tema real guardado por el usuario. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('diana-portfolio-theme') || 'dark';
          var theme =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored;
          document.documentElement.classList.add(theme);
        } catch (error) {
          // localStorage bloqueado (modo privado, cookies deshabilitadas):
          // se cae al tema por defecto del provider.
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
